<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*" />
    <meta http-equiv="Feature-Policy" content="camera 'self'; microphone 'self'" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        a-scene {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #status {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            z-index: 2;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .found { 
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.95), rgba(56, 142, 60, 0.95)) !important;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4) !important;
        }
        .lost { 
            background: rgba(0, 0, 0, 0.75) !important;
            backdrop-filter: blur(10px);
        }

        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            display: none;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }
        #start-button:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            transform: translate(-50%, -50%) translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
        }
    </style>
</head>
<body>
    <div id="status"></div>
    <button id="start-button">🚀 Start AR Scanner</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./Igas1.mind;"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
    >
        <a-assets>
            <video 
                id="my-video" 
                src="./IgasVideo.mp4"
                loop="true"
                preload="auto"
                muted
                crossorigin="anonymous"
                playsinline
                webkit-playsinline
            ></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <a-plane 
                id="video-plane"
                position="0 0 0"
                width="1"
                height="1"
                rotation="0 0 0"
                scale="0.95 0.95 1" 
                material="shader: flat; src: #my-video; transparent: false; side: double;"
            ></a-plane>
        </a-entity>
    </a-scene>

    <script>
    // ✅ Custom component that properly scales the video slightly smaller than target
    AFRAME.registerComponent('video-fit', {
      schema: {
        target: { type: 'selector' },
        scaleFactor: {type: 'number', default: 0.95}  // ~93% of original
      },
      init() {
        this.video = this.data.target;
        this.video.addEventListener('loadedmetadata', () => this.fitVideo());
      },
      fitVideo() {
        const vid = this.video;
        if (!vid.videoWidth || !vid.videoHeight) return;

        const videoAspect = vid.videoWidth / vid.videoHeight;
        const plane = this.el;
        const planeWidth = plane.getAttribute('width');
        const planeHeight = plane.getAttribute('height');
        const planeAspect = planeWidth / planeHeight;

        let scaleX = 1, scaleY = 1;

        if (videoAspect > planeAspect) {
          scaleY = videoAspect / planeAspect;
        } else if (videoAspect < planeAspect) {
          scaleX = planeAspect / videoAspect;
        }

        // 👇 Apply your "slightly smaller" scaling here
        const shrink = this.data.scaleFactor; 
        plane.setAttribute('scale', `${scaleX * shrink} ${scaleY * shrink} 1`);
        console.log(`🎥 Video scaled to ${Math.round(shrink * 100)}% of target area`);
      }
    });


    // ===============================
    // Existing Scanner / Status Logic
    // ===============================
    const statusEl = document.getElementById('status');
    const video = document.getElementById('my-video');

    async function requestCameraPermission() {
        try {
            statusEl.textContent = '';
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Camera API not supported');
            }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
            } catch (envError) {
                console.warn('Environment camera failed, trying any camera:', envError);
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            stream.getTracks().forEach(track => track.stop());
            statusEl.textContent = '';
            return true;
        } catch (error) {
            console.error('Camera permission denied:', error);
            statusEl.textContent = '❌ Camera access required';
            return false;
        }
    }

    async function initializeScanner() {
        const startButton = document.getElementById('start-button');
        startButton.style.display = 'none';

        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isMobile) {
            const hasPermission = await requestCameraPermission();
            if (!hasPermission) {
                startButton.style.display = 'block';
                startButton.textContent = 'Retry Camera Access';
                return;
            }
        }
        statusEl.textContent = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const startButton = document.getElementById('start-button');
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isMobile) {
            statusEl.textContent = '';
            startButton.style.display = 'block';
            startButton.addEventListener('click', initializeScanner);
        } else {
            statusEl.textContent = '';
        }
    });

    document.querySelector('a-scene').addEventListener('loaded', () => {
        console.log('Scene loaded');
        statusEl.textContent = '';
        statusEl.classList.remove('found', 'lost');
        
        // Preload video
        video.load();
    });

    document.getElementById('target').addEventListener('targetFound', () => {
        console.log('Target found!');
        statusEl.textContent = '';
        statusEl.classList.add('found');
        statusEl.classList.remove('lost');
        
        // Force video to play with multiple attempts
        const playVideo = () => {
            video.muted = false;
            video.play().then(() => {
                console.log('Video playing successfully');
            }).catch(e => {
                console.log('Play attempt failed, retrying...', e);
                setTimeout(playVideo, 100);
            });
        };
        playVideo();
    });

    document.getElementById('target').addEventListener('targetLost', () => {
        console.log('Target lost');
        statusEl.textContent = '';
        statusEl.classList.add('lost');
        statusEl.classList.remove('found');
        video.pause();
    });
    </script>
</body>
</html>
