<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Permissions-Policy" content="camera=*, microphone=*, geolocation=*" />
    <meta http-equiv="Feature-Policy" content="camera 'self'; microphone 'self'" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .example-container {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            color: white;
            max-width: 300px;
        }
        
        .example-container h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        
        .target-preview {
            width: 150px;
            border: 3px solid #4CAF50;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        #status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 2;
            font-size: 14px;
        }
        
        .found { background: rgba(76, 175, 80, 0.9) !important; }
        .lost { background: rgba(244, 67, 54, 0.9) !important; }
        
        #download-link {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        
        #start-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        
        #start-button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="status">Initializing...</div>
    <button id="start-button">Start AR Scanner</button>

    <a-scene 
        mindar-image="imageTargetSrc: ./Igas1.mind;"
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false"
    >
        <a-assets>
            <video 
                id="my-video" 
                src="./IgasVideo.mp4"
                loop="true"
                preload="auto"
                muted
                crossorigin="anonymous"
                playsinline
                webkit-playsinline
            >
                <source src="./IgasVideo.mp4" type="video/mp4">
            </video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0" id="target">
            <!-- Single video plane; no background plane to avoid size mismatch -->
            <a-plane 
                id="video-plane"
                position="0 0 0" 
                height="1" 
                width="1"
                rotation="0 0 0"
                material="shader: flat; src: #my-video; transparent: false;"
            ></a-plane>
        </a-entity>
    </a-scene>

    <script>
        const statusEl = document.getElementById('status');
        const video = document.getElementById('my-video');
        const videoPlane = document.getElementById('video-plane');
        
        // Request camera permissions explicitly on mobile
        async function requestCameraPermission() {
            try {
                statusEl.textContent = '📱 Requesting camera permission...';
                
                // Check if getUserMedia is available
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Camera API not supported');
                }
                
                // Request camera permission explicitly with multiple fallback options
                let stream;
                try {
                    // Try with environment camera first (back camera)
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: { ideal: 'environment' },
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        } 
                    });
                } catch (envError) {
                    console.warn('Environment camera failed, trying any camera:', envError);
                    // Fallback to any available camera
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true
                    });
                }
                
                // Stop the stream immediately - we just needed permission
                stream.getTracks().forEach(track => track.stop());
                
                statusEl.textContent = '📹 Camera permission granted, starting AR...';
                return true;
            } catch (error) {
                console.error('Camera permission denied:', error);
                let errorMessage = '❌ Camera access required for AR scanning';
                
                if (error.name === 'NotAllowedError') {
                    errorMessage = '❌ Camera permission denied. Please allow camera access and refresh.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = '❌ No camera found on this device.';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage = '❌ Camera not supported on this browser.';
                }
                
                statusEl.textContent = errorMessage;
                return false;
            }
        }
        
        // Initialize AR scanner
        async function initializeScanner() {
            const startButton = document.getElementById('start-button');
            startButton.style.display = 'none';
            
            // Check if we're on mobile
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                const hasPermission = await requestCameraPermission();
                if (!hasPermission) {
                    startButton.style.display = 'block';
                    startButton.textContent = 'Retry Camera Access';
                    return; // Stop if no camera permission
                }
            }
            
            statusEl.textContent = '📹 Camera starting...';
        }
        
        // Update status on load
        document.addEventListener('DOMContentLoaded', () => {
            const startButton = document.getElementById('start-button');
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                // Show start button on mobile to ensure user interaction
                statusEl.textContent = '📱 Tap to start AR scanner';
                startButton.style.display = 'block';
                startButton.addEventListener('click', initializeScanner);
            } else {
                // Auto-start on desktop
                statusEl.textContent = '📹 Camera starting...';
            }
        });

        // Scene loaded
        document.querySelector('a-scene').addEventListener('loaded', () => {
            console.log('Scene loaded');
            statusEl.textContent = '🔍 Scanning for target...';
            statusEl.classList.remove('found', 'lost');
        });

        // When video metadata is ready, set plane height to match exact aspect
        video.addEventListener('loadedmetadata', () => {
            try {
                const vw = video.videoWidth || 1;
                const vh = video.videoHeight || 1;
                const aspect = vh / vw; // height per unit width
                // Keep width = 1 unit, compute height to match video
                videoPlane.setAttribute('width', 1);
                videoPlane.setAttribute('height', aspect);
            } catch (e) { console.warn('Aspect compute failed', e); }
        });

        // Target found
        document.getElementById('target').addEventListener('targetFound', event => {
            console.log('Target found!');
            statusEl.textContent = '✅ Target Found! Video Playing';
            statusEl.classList.add('found');
            statusEl.classList.remove('lost');
            
            // Play video
            video.play().catch(e => {
                console.log('Play error:', e);
                video.muted = true;
                video.play();
            });
        });

        // Target lost
        document.getElementById('target').addEventListener('targetLost', event => {
            console.log('Target lost');
            statusEl.textContent = '❌ Target Lost - Keep scanning';
            statusEl.classList.add('lost');
            statusEl.classList.remove('found');
        });

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Error:', e);
            statusEl.textContent = '⚠️ Error: ' + e.message;
        });
    </script>
</body>
</html>
